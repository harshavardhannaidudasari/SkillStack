<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skillstack</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');


  :root{
    --bg:#f3f5fa;
    --surface:#ffffff;
    --surface-2:#eef1f8;
    --surface-3:#e4e8f3;
    --border:#dbe1ee;
    --text:#171b2b;
    --text-dim:#5b6785;
    --text-faint:#8891ab;
    --accent:#b96a17;
    --accent-strong:#a75d10;
    --accent-ink:#ffffff;
    --accent-2:#1f8f72;
    --danger:#c1442f;
    --badge-s:62%;
    --badge-l:38%;
    --badge-ink:#ffffff;
    --shadow:0 1px 2px rgba(23,27,43,.06), 0 8px 24px -12px rgba(23,27,43,.15);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1320;
      --surface:#161d2e;
      --surface-2:#1c2439;
      --surface-3:#242e46;
      --border:#2b3550;
      --text:#e9ecf6;
      --text-dim:#a2acc7;
      --text-faint:#7885a6;
      --accent:#f2a53f;
      --accent-strong:#ffbd66;
      --accent-ink:#1c1204;
      --accent-2:#5bcda6;
      --danger:#ef7a64;
      --badge-s:68%;
      --badge-l:58%;
      --badge-ink:#161a10;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1320;
    --surface:#161d2e;
    --surface-2:#1c2439;
    --surface-3:#242e46;
    --border:#2b3550;
    --text:#e9ecf6;
    --text-dim:#a2acc7;
    --text-faint:#7885a6;
    --accent:#f2a53f;
    --accent-strong:#ffbd66;
    --accent-ink:#1c1204;
    --accent-2:#5bcda6;
    --danger:#ef7a64;
    --badge-s:68%;
    --badge-l:58%;
    --badge-ink:#161a10;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.55);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  h1,h2,h3,h4{
    font-family:'Sora',ui-sans-serif,system-ui,sans-serif;
    text-wrap:balance;
    margin:0;
    letter-spacing:-0.01em;
  }
  code,.mono,.badge,.eyebrow,.kbd{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent);color:var(--accent-ink);}

  .eyebrow{
    font-size:.68rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-faint); font-weight:600;
  }

  /* ---------- App shell ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}

  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:16px;
    padding:12px 24px;
    background:color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;border:none;background:none;color:inherit;padding:2px; perspective:400px;}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(155deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora'; font-weight:800; font-size:.85rem; color:#171308;
    flex:none; transform-style:preserve-3d; box-shadow:0 2px 6px -2px rgba(0,0,0,.4);
    transition:transform .6s cubic-bezier(.2,.9,.2,1);
  }
  .brand:hover .brand-mark{ transform:rotateY(360deg) rotateX(10deg); }
  .brand-name{font-family:'Sora';font-weight:700;font-size:1.05rem;}
  .brand-sub{font-size:.68rem;color:var(--text-faint);margin-top:1px;}
  .topnav{display:flex; align-items:center; gap:4px; margin-left:10px;}
  .topnav-link{
    border:1px solid transparent; background:none; color:var(--text-dim);
    font-size:.82rem; font-weight:500; padding:8px 12px; border-radius:999px; cursor:pointer;
    white-space:nowrap;
  }
  .topnav-link:hover{color:var(--text); background:var(--surface-2);}
  .topnav-link.active{color:var(--text); background:var(--surface-2); border-color:var(--border); font-weight:600;}
  .topbar-spacer{flex:1;}
  .topstat{
    display:flex; align-items:center; gap:8px;
    font-size:.78rem; color:var(--text-dim);
    padding:6px 12px; border:1px solid var(--border); border-radius:999px;
    background:var(--surface);
  }
  .topstat b{color:var(--text); font-variant-numeric:tabular-nums;}
  .ring{width:16px;height:16px;flex:none;}
  .theme-btn{
    width:34px;height:34px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .theme-btn:hover{color:var(--text); border-color:var(--text-faint);}
  .theme-btn:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .theme-btn svg{width:16px;height:16px;}

  main{flex:1; width:100%;}

  /* ---------- Home view ---------- */
  .home-wrap{max-width:1180px;margin:0 auto;padding:40px 24px 80px;}
  .hero{
    position:relative; overflow:hidden;
    display:grid; grid-template-columns:1.3fr 1fr; gap:36px;
    align-items:center;
    padding:34px 8px 40px;
    border-bottom:1px solid var(--border);
    margin-bottom:36px;
  }
  .hero-canvas{
    position:absolute; inset:-40px -10px -60px;
    width:calc(100% + 20px); height:calc(100% + 100px);
    pointer-events:none; z-index:0; opacity:.9; cursor:grab; touch-action:none;
  }
  .hero-canvas.grabbable{pointer-events:auto;}
  .hero-canvas.dragging{cursor:grabbing;}
  .hero > div{ position:relative; z-index:1; pointer-events:none; }
  .hero h1{font-size:2.3rem; line-height:1.12; font-weight:800;}
  .hero h1 em{
    font-style:normal; color:var(--accent-strong);
    text-decoration:underline; text-decoration-color:color-mix(in srgb, var(--accent) 55%, transparent);
    text-decoration-thickness:3px; text-underline-offset:5px;
  }
  .hero p{color:var(--text-dim); font-size:1rem; max-width:52ch; margin-top:14px;}
  .hero-note{
    margin-top:18px; display:flex; gap:10px; align-items:flex-start;
    font-size:.82rem; color:var(--text-faint); max-width:56ch;
  }
  .hero-note svg{flex:none; margin-top:2px; width:15px;height:15px;}
  .hero-stats{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .stat-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .stat-tile .n{font-family:'Sora'; font-size:1.7rem; font-weight:800; font-variant-numeric:tabular-nums;}
  .stat-tile .l{font-size:.74rem; color:var(--text-faint); margin-top:2px;}
  .stat-tile.wide{grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; gap:14px;}
  .progress-track{flex:1; height:8px; border-radius:999px; background:var(--surface-3); overflow:hidden;}
  .progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent-2),var(--accent)); transition:width .4s ease;}

  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin:0 0 16px;}
  .section-head h2{font-size:1.25rem;}
  .search-box{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--border); background:var(--surface); border-radius:999px;
    padding:8px 14px; min-width:230px;
  }
  .search-box svg{width:15px;height:15px; color:var(--text-faint); flex:none;}
  .search-box input{
    border:none; outline:none; background:none; color:var(--text); font-size:.85rem; width:100%;
  }
  .search-box input::placeholder{color:var(--text-faint);}

  .course-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px;
  }
  .course-card{
    text-align:left; cursor:pointer; border:1px solid var(--border); background:var(--surface);
    border-radius:var(--radius-lg); padding:20px; display:flex; flex-direction:column; gap:14px;
    box-shadow:var(--shadow); transition:transform .12s ease-out, border-color .15s ease, box-shadow .15s ease;
    position:relative; overflow:hidden; transform-style:preserve-3d; will-change:transform;
  }
  .course-card:hover{border-color:var(--text-faint); box-shadow:0 1px 2px rgba(23,27,43,.06), 0 20px 34px -16px rgba(23,27,43,.28);}
  .course-card::before{
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%), color-mix(in srgb, var(--accent) 45%, white), transparent 65%);
    opacity:0; transition:opacity .3s ease;
  }
  .course-card:hover::before{opacity:.16;}
  .course-card > *{position:relative;}
  .course-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:40px; height:28px; padding:0 9px; border-radius:8px;
    font-size:.72rem; font-weight:600; letter-spacing:.03em;
    background:hsl(var(--hue) var(--badge-s) var(--badge-l)); color:var(--badge-ink);
  }
  .rank{font-size:.68rem; color:var(--text-faint); font-weight:600;}
  .course-card h3{font-size:1.05rem; margin-top:2px;}
  .course-card p{font-size:.84rem; color:var(--text-dim); margin:0; flex:1;}
  .course-meta{display:flex; align-items:center; justify-content:space-between; font-size:.72rem; color:var(--text-faint); gap:10px;}
  .course-meta .progress-track{height:6px;}
  .course-meta-row{display:flex; align-items:center; gap:8px; flex:1;}

  /* ---------- Course view ---------- */
  .course-shell{
    display:grid; grid-template-columns:290px 1fr; min-height:calc(100vh - 61px); align-items:start;
  }
  .sidebar{
    position:sticky; top:61px; align-self:start;
    height:calc(100vh - 61px); overflow-y:auto;
    border-right:1px solid var(--border); background:var(--surface);
    padding:20px 16px 40px;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:6px; border:none; background:none; color:var(--text-dim);
    font-size:.78rem; cursor:pointer; padding:4px 0; margin-bottom:14px;
  }
  .back-link:hover{color:var(--text);}
  .back-link svg{width:13px;height:13px;}
  .sidebar-title{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .sidebar-title h2{font-size:1rem;}
  .sidebar .course-progress{font-size:.72rem; color:var(--text-faint); margin-bottom:16px;}
  .topic-list{list-style:none; margin:0; padding:0 0 0 2px; display:flex; flex-direction:column; gap:3px; position:relative;}
  .topic-list::before{
    content:''; position:absolute; left:19px; top:20px; bottom:20px; width:2px;
    background:repeating-linear-gradient(var(--border),var(--border) 4px, transparent 4px, transparent 8px);
    z-index:0;
  }
  .topic-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    border:1px solid transparent; background:none; color:var(--text-dim);
    padding:9px 10px; border-radius:var(--radius-sm); cursor:pointer; font-size:.83rem;
    position:relative; z-index:1;
  }
  .topic-item:hover{background:var(--surface-2); color:var(--text);}
  .topic-item.active{background:var(--surface-3); color:var(--text); border-color:var(--border); font-weight:600;}
  .topic-num{
    flex:none; width:22px; height:22px; border-radius:999px; font-size:.66rem;
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono';
    background:radial-gradient(circle at 32% 28%, var(--surface-3), var(--surface-2) 72%);
    color:var(--text-faint);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.3), inset 0 -2px 3px rgba(0,0,0,.22), 0 1px 2px rgba(0,0,0,.15);
  }
  .topic-item.done .topic-num{
    background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--accent-2) 80%, white), var(--accent-2) 78%);
    color:#0c2119;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.55), inset 0 -2px 3px rgba(0,0,0,.25), 0 2px 6px -1px color-mix(in srgb, var(--accent-2) 65%, transparent);
  }
  .topic-item.active .topic-num{outline:2px solid var(--accent); outline-offset:2px;}
  .topic-item span.tt{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .content-pane{padding:32px 40px 90px; max-width:840px;}
  .crumb{font-size:.76rem; color:var(--text-faint); margin-bottom:10px; display:flex; gap:6px; align-items:center;}
  .content-pane h1{font-size:1.6rem; margin-bottom:6px;}
  .lede{color:var(--text-dim); font-size:.98rem; max-width:64ch; margin-bottom:22px;}

  .video-frame{
    position:relative; width:100%; aspect-ratio:16/9; border-radius:var(--radius-lg);
    overflow:hidden; background:#000; border:1px solid var(--border); box-shadow:var(--shadow);
  }
  .video-frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .video-credit{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:.72rem; color:var(--text-faint); margin-top:8px;
  }
  .video-credit a{color:var(--text-dim); text-decoration:none; border-bottom:1px dotted var(--text-faint);}

  .topic-nav{display:flex; justify-content:space-between; gap:10px; margin-top:22px;}
  .nav-btn{
    display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); padding:9px 14px; border-radius:999px; cursor:pointer; font-size:.82rem;
  }
  .nav-btn:hover{border-color:var(--text-faint);}
  .nav-btn:disabled{opacity:.35; cursor:default;}
  .nav-btn svg{width:14px;height:14px;}

  .practice{
    margin-top:38px; border:1px solid var(--border); border-radius:var(--radius-lg);
    background:var(--surface); box-shadow:var(--shadow); padding:26px 26px 22px;
  }
  .practice-head{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .practice-head .pill{
    font-size:.65rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--accent-strong);
    padding:4px 10px; border-radius:999px;
  }
  .practice-head h3{font-size:1.08rem;}
  .practice > p.hint{color:var(--text-faint); font-size:.82rem; margin:6px 0 20px;}

  .quiz-q{margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid var(--border);}
  .quiz-q:last-of-type{border-bottom:none; margin-bottom:6px; padding-bottom:4px;}
  .quiz-q .qtext{font-weight:600; font-size:.92rem; margin-bottom:10px;}
  .opt-list{display:flex; flex-direction:column; gap:8px;}
  .opt{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius-sm);
    border:1px solid var(--border); cursor:pointer; font-size:.85rem; background:var(--surface-2);
  }
  .opt:hover{border-color:var(--text-faint);}
  .opt input{accent-color:var(--accent);}
  .opt.correct{border-color:var(--accent-2); background:color-mix(in srgb, var(--accent-2) 16%, var(--surface-2));}
  .opt.wrong{border-color:var(--danger); background:color-mix(in srgb, var(--danger) 14%, var(--surface-2));}
  .q-feedback{font-size:.78rem; margin-top:8px; color:var(--text-dim);}
  .q-feedback.ok{color:var(--accent-2);}
  .q-feedback.no{color:var(--danger);}

  .practice-actions{display:flex; align-items:center; gap:14px; margin-top:8px;}
  .btn-primary{
    background:var(--accent); color:var(--accent-ink); border:none; font-weight:600;
    padding:10px 20px; border-radius:999px; cursor:pointer; font-size:.86rem;
    box-shadow:0 3px 0 var(--accent-strong), 0 8px 16px -8px rgba(0,0,0,.4);
    transform:translateY(0); transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn-primary:hover{background:var(--accent-strong);}
  .btn-primary:active{transform:translateY(3px); box-shadow:0 0 0 var(--accent-strong), 0 4px 8px -6px rgba(0,0,0,.4);}
  .btn-primary:disabled{opacity:.45; cursor:default; box-shadow:none; transform:none;}
  .nav-btn{transition:transform .1s ease, border-color .15s ease, box-shadow .1s ease;}
  .nav-btn:active:not(:disabled){transform:translateY(2px);}
  .result-msg{font-size:.85rem; font-weight:600;}
  .result-msg.ok{color:var(--accent-2);}
  .result-msg.no{color:var(--danger);}

  /* ---------- Course Map / Campus Tour / Progress (3D views) ---------- */
  .view-wrap{max-width:1040px; margin:0 auto; padding:28px 24px 80px;}
  .view-wrap h1{font-size:1.6rem; margin-bottom:6px;}
  .view-wrap .lede{color:var(--text-dim); font-size:.95rem; max-width:64ch; margin-bottom:20px;}
  .stage-3d{
    position:relative; width:100%; height:58vh; min-height:400px; max-height:560px;
    border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--border);
    background:radial-gradient(circle at 50% 30%, var(--surface-2), var(--bg) 78%);
    box-shadow:var(--shadow);
  }
  .stage-3d.tall{height:66vh; max-height:640px;}
  .stage-3d canvas{width:100%; height:100%; display:block; cursor:grab; touch-action:none;}
  .stage-3d canvas.dragging{cursor:grabbing;}
  .stage-hint{
    position:absolute; left:14px; bottom:14px; z-index:2; pointer-events:none;
    font-size:.74rem; color:var(--text-faint); background:color-mix(in srgb, var(--surface) 78%, transparent);
    border:1px solid var(--border); border-radius:999px; padding:6px 12px; backdrop-filter:blur(6px);
  }
  .stage-labels{position:absolute; inset:0; z-index:1; pointer-events:none;}
  .map-label{
    position:absolute; transform:translate(-50%,-130%);
    font-family:'IBM Plex Mono'; font-size:.68rem; font-weight:600; color:var(--text);
    background:color-mix(in srgb, var(--surface) 82%, transparent); border:1px solid var(--border);
    border-radius:6px; padding:2px 7px; white-space:nowrap;
  }
  .map-label.locked{color:var(--text-faint); opacity:.75;}
  .map-label.complete{color:var(--accent-2); border-color:color-mix(in srgb, var(--accent-2) 50%, var(--border));}

  @media (max-width:880px){
    .hero{grid-template-columns:1fr;}
    .course-shell{grid-template-columns:1fr;}
    .sidebar{position:static; height:auto; border-right:none; border-bottom:1px solid var(--border);}
    .content-pane{padding:26px 18px 70px;}
    .stage-3d, .stage-3d.tall{height:52vh; min-height:320px;}
    .view-wrap{padding:22px 16px 60px;}
  }
  @media (max-width:760px){
    .topnav{margin-left:0; order:3; width:100%; justify-content:flex-start; overflow-x:auto; padding-top:4px;}
    .topbar{flex-wrap:wrap; row-gap:6px;}
    .topbar-spacer{display:none;}
  }

  [hidden]{display:none!important;}
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <button class="brand" id="brandBtn" aria-label="Skillstack home">
      <span class="brand-mark">SS</span>
      <span>
        <div class="brand-name">Skillstack</div>
        <div class="brand-sub">Learn &middot; Watch &middot; Practice</div>
      </span>
    </button>
    <nav class="topnav" id="topNav">
      <button class="topnav-link" data-route="#/map">🗺️ Course Map</button>
      <button class="topnav-link" data-route="#/campus">🏛️ Campus Tour</button>
      <button class="topnav-link" data-route="#/progress">📊 Progress</button>
    </nav>
    <div class="topbar-spacer"></div>
    <div class="topstat" id="overallStat" title="Topics you've completed across all courses">
      <svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--surface-3)" stroke-width="4"/><circle id="ringFill" cx="18" cy="18" r="15.5" fill="none" stroke="var(--accent-2)" stroke-width="4" stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="97.4" transform="rotate(-90 18 18)"/></svg>
      <span><b id="overallCount">0</b>/<span id="overallTotal">80</span> topics done</span>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle color theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main id="main"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

/* ============ 3D HERO SCENE (three.js) ============ */
const HERO_HUES = [258,198,6,217,150,324,280,32,92,168,121,302];
function hslToHexNum(h,s,l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return parseInt(`${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`,16);
}
let heroScene = null;
function initHeroScene(){
  const canvas = document.getElementById('heroCanvas');
  if(!canvas || typeof THREE === 'undefined') return;
  let renderer;
  try{
    renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  }catch(e){ return; }

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0,0,9);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dir1 = new THREE.DirectionalLight(0xffffff, 0.85);
  dir1.position.set(4,6,8);
  scene.add(dir1);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.35);
  dir2.position.set(-6,-3,-4);
  scene.add(dir2);

  const group = new THREE.Group();
  scene.add(group);

  const geomFns = [
    ()=>new THREE.IcosahedronGeometry(1,0),
    ()=>new THREE.OctahedronGeometry(1,0),
    ()=>new THREE.TorusGeometry(0.7,0.24,10,24),
    ()=>new THREE.TetrahedronGeometry(1,0),
    ()=>new THREE.TorusKnotGeometry(0.5,0.16,80,10)
  ];
  const meshes = [];
  const count = 9;
  for(let i=0;i<count;i++){
    const hue = HERO_HUES[i % HERO_HUES.length];
    const mat = new THREE.MeshStandardMaterial({color:hslToHexNum(hue,65,58), roughness:0.35, metalness:0.15, transparent:true, opacity:0.92});
    const mesh = new THREE.Mesh(geomFns[i % geomFns.length](), mat);
    mesh.scale.setScalar(0.32 + Math.random()*0.5);
    mesh.position.set((Math.random()-0.5)*8.5, (Math.random()-0.5)*5.2, (Math.random()-0.5)*4 - 1);
    mesh.userData = {
      rot: new THREE.Vector3((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.25),
      phase: Math.random()*Math.PI*2,
      speed: 0.45 + Math.random()*0.5,
      baseY: mesh.position.y
    };
    group.add(mesh);
    meshes.push(mesh);
  }

  let mouseX=0, mouseY=0;
  function onMouseMove(e){
    mouseX = (e.clientX / window.innerWidth) - 0.5;
    mouseY = (e.clientY / window.innerHeight) - 0.5;
  }
  window.addEventListener('mousemove', onMouseMove);

  /* drag-to-rotate the whole cluster */
  let dragging = false, lastX=0, lastY=0, dragVelX=0, dragVelY=0;
  canvas.classList.add('grabbable');
  function onPointerDown(e){
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    dragVelX = 0; dragVelY = 0;
    canvas.classList.add('dragging');
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  }
  function onPointerMove(e){
    if(!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    dragVelY = dx*0.006; dragVelX = dy*0.006;
    group.rotation.y += dragVelY;
    group.rotation.x += dragVelX;
  }
  function onPointerUp(){
    dragging = false;
    canvas.classList.remove('dragging');
  }
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);

  function resize(){
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(rect.width,1), h = Math.max(rect.height,1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.setSize(w,h,false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const clock = new THREE.Clock();
  let raf = null;
  function tick(){
    const t = clock.getElapsedTime();
    meshes.forEach(m=>{
      m.rotation.x += m.userData.rot.x*0.01;
      m.rotation.y += m.userData.rot.y*0.01;
      m.position.y = m.userData.baseY + Math.sin(t*m.userData.speed + m.userData.phase)*0.3;
    });
    if(dragging){
      /* driven directly by pointermove */
    } else {
      group.rotation.y += dragVelY + 0.0018;
      group.rotation.x += dragVelX;
      dragVelY *= 0.94; dragVelX *= 0.94;
      group.rotation.x = Math.max(-0.5, Math.min(0.5, group.rotation.x));
    }
    camera.position.x += (mouseX*1.3 - camera.position.x)*0.03;
    camera.position.y += (-mouseY*0.9 - camera.position.y)*0.03;
    camera.lookAt(0,0,0);
    renderer.render(scene, camera);
    raf = requestAnimationFrame(tick);
  }
  if(reduceMotion){ renderer.render(scene, camera); } else { tick(); }

  heroScene = {
    dispose(){
      if(raf) cancelAnimationFrame(raf);
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('resize', resize);
      window.removeEventListener('pointerup', onPointerUp);
      canvas.removeEventListener('pointerdown', onPointerDown);
      canvas.removeEventListener('pointermove', onPointerMove);
      meshes.forEach(m=>{ m.geometry.dispose(); m.material.dispose(); });
      renderer.dispose();
    }
  };
}
function disposeHeroScene(){
  if(heroScene){ heroScene.dispose(); heroScene = null; }
}

/* ============ 3D TILT COURSE CARDS ============ */
function attachTilt(card){
  const max = 10;
  function onMove(e){
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left)/r.width;
    const py = (e.clientY - r.top)/r.height;
    const rx = (0.5-py) * max;
    const ry = (px-0.5) * max;
    card.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-4px) translateZ(6px)`;
    card.style.setProperty('--mx', (px*100)+'%');
    card.style.setProperty('--my', (py*100)+'%');
  }
  function onLeave(){ card.style.transform = ''; }
  card.addEventListener('mousemove', onMove);
  card.addEventListener('mouseleave', onLeave);
}

/* theme */
function initTheme(){
  const saved = localStorage.getItem('skillstack_theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon();
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const curDark = cur ? cur==='dark' : sysDark;
  const next = curDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('skillstack_theme', next);
  updateThemeIcon();

function parseHash(){
  const h = location.hash.replace(/^#\/?/,'');
  const parts = h.split('/').filter(Boolean);
  if(parts[0]==='course' && parts[1]){
    const course = COURSES.find(c=>c.id===parts[1]);
    if(course){
      let ti = parts[3]!==undefined ? parseInt(parts[3],10) : 0;
      if(isNaN(ti) || ti<0 || ti>=course.topics.length) ti = 0;
      return {view:'course', course, ti};
    }
  }
  if(parts[0]==='map') return {view:'map'};
  if(parts[0]==='campus') return {view:'campus'};
  if(parts[0]==='progress') return {view:'progress'};
  return {view:'home'};
}

/* ============ SHARED 3D VIEW HELPERS ============
   Used by the Course Map, Campus Tour, and Progress views below. Home's
   hero scene (above) predates this and is left exactly as-is since it
   already works — no reason to risk touching tested code for the sake of
   sharing a helper. */
let activeView3D = null;
function disposeActiveView3D(){
  if(activeView3D){ activeView3D.dispose(); activeView3D = null; }
}
// Projects a 3D point to CSS pixel coordinates within `canvas`, for
// positioning an HTML label over a Three.js scene (crisper and far simpler
// than building real 3D text geometry for this many short labels).
function project3D(vec3, camera, canvas){
  const v = vec3.clone().project(camera);
  const rect = canvas.getBoundingClientRect();
  return {
    x: (v.x*0.5+0.5) * rect.width,
    y: (1-(v.y*0.5+0.5)) * rect.height,
    behind: v.z > 1
  };
}

/* ============ RENDER: COURSE MAP ============
   A gamified 3D checkpoint path: one node per course, strung along a curve,
   styled by progress (locked/in-progress/complete). Nothing is actually
   access-gated — SkillStack stays self-paced/click-anywhere like the rest
   of the site — the checkpoint styling is purely a visual "how far along
   am I" cue, same information the home grid's progress bars already show. */
function renderMap(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="view-wrap">
      <button class="back-link" id="mapBackBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> All courses</button>
      <h1>Course Map</h1>
      <p class="lede">Every course as a checkpoint along the path — lit once you've started, filled in once it's done. Drag to look around, click a checkpoint to jump in.</p>
      <div class="stage-3d" id="mapStage">
        <canvas id="mapCanvas"></canvas>
        <div class="stage-labels" id="mapLabels"></div>
        <div class="stage-hint">🖱️ Drag to orbit · Click a checkpoint to open it</div>
      </div>
    </div>
  `;
  document.getElementById('mapBackBtn').addEventListener('click', ()=>{ location.hash = '#/'; });
  initMapScene();
}

function initMapScene(){
  const canvas = document.getElementById('mapCanvas');
  const labelLayer = document.getElementById('mapLabels');
  if(!canvas || typeof THREE === 'undefined') return;
  let renderer;
  try{ renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true}); }
  catch(e){ return; }

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 100);
  camera.position.set(0, 5, 13);
  camera.lookAt(0,0,0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(5,8,6);
  scene.add(dir);

  const group = new THREE.Group();
  scene.add(group);

  // A winding S-curve through 3D space, one control point per course.
  const n = COURSES.length;
  const points = COURSES.map((c,i)=>{
    const t = i/(n-1);
    return new THREE.Vector3(
      (t-0.5) * 15,
      Math.sin(t*Math.PI*2.2) * 1.4,
      Math.cos(t*Math.PI*1.6) * 3.2
    );
  });
  const curve = new THREE.CatmullRomCurve3(points);

  const pathGeom = new THREE.TubeGeometry(curve, 200, 0.05, 8, false);
  const pathMat = new THREE.MeshStandardMaterial({color:0x8892b0, roughness:0.6, transparent:true, opacity:0.55});
  group.add(new THREE.Mesh(pathGeom, pathMat));

  const nodes = COURSES.map((c,i)=>{
    const done = courseDoneCount(c);
    const pct = done/c.topics.length;
    const color = hslToHexNum(c.hue, 70, 55);
    const state = pct>=1 ? 'complete' : pct>0 ? 'progress' : 'locked';
    const mat = new THREE.MeshStandardMaterial({
      color: state==='locked' ? 0x475066 : color,
      roughness:0.35, metalness:0.2,
      transparent: state==='locked', opacity: state==='locked' ? 0.55 : 1,
      emissive: state==='locked' ? 0x000000 : color,
      emissiveIntensity: state==='complete' ? 0.55 : state==='progress' ? 0.22 : 0,
    });
    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(state==='locked'?0.38:0.5, 0), mat);
    mesh.position.copy(points[i]);
    mesh.userData = {course:c, state, baseScale: state==='locked'?0.38:0.5, phase:Math.random()*Math.PI*2};
    group.add(mesh);
    return mesh;
  });

  let dragging=false, lastX=0, lastY=0, dragVelX=0, dragVelY=0, movedSinceDown=0;
  canvas.classList.add('grabbable');
  function onPointerDown(e){
    dragging=true; lastX=e.clientX; lastY=e.clientY; dragVelX=0; dragVelY=0; movedSinceDown=0;
    canvas.classList.add('dragging');
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  }
  function onPointerMove(e){
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY;
    movedSinceDown += Math.abs(dx)+Math.abs(dy);
    dragVelY = dx*0.006; dragVelX = dy*0.006;
    group.rotation.y += dragVelY;
    group.rotation.x = Math.max(-0.4, Math.min(0.4, group.rotation.x + dragVelX));
  }
  function onPointerUp(e){
    dragging=false;
    canvas.classList.remove('dragging');
    // A near-stationary pointerdown+up is treated as a click, not a drag.
    if(movedSinceDown < 6) handleClick(e);
  }
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);

  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  function handleClick(e){
    const rect = canvas.getBoundingClientRect();
    ndc.x = ((e.clientX-rect.left)/rect.width)*2-1;
    ndc.y = -((e.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObjects(nodes)[0];
    if(hit) location.hash = `#/course/${hit.object.userData.course.id}/topic/0`;
  }

  function resize(){
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(rect.width,1), h = Math.max(rect.height,1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.setSize(w,h,false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  const _worldPos = new THREE.Vector3();
  function renderLabels(){
    labelLayer.innerHTML = nodes.map(mesh=>{
      // mesh.position is local to `group`, which the drag-to-orbit handler
      // rotates — project the *world* position (getWorldPosition applies
      // the group's current matrixWorld) or labels drift away from their
      // nodes as soon as the scene is rotated. Confirmed live: without
      // this, dragging the map desynced every label from its checkpoint.
      mesh.getWorldPosition(_worldPos);
      const p = project3D(_worldPos, camera, canvas);
      if(p.behind) return '';
      const c = mesh.userData.course;
      const cls = mesh.userData.state;
      return `<div class="map-label ${cls}" style="left:${p.x}px; top:${p.y}px;">${escapeHtml(c.code)}</div>`;
    }).join('');
  }

  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const clock = new THREE.Clock();
  let raf = null;
  function tick(){
    const t = clock.getElapsedTime();
    nodes.forEach(m=>{
      const pulse = m.userData.state==='progress' ? 1 + Math.sin(t*2 + m.userData.phase)*0.08 : 1;
      m.scale.setScalar(m.userData.baseScale * pulse);
      m.rotation.y += 0.01;
    });
    // Drag-only rotation here, deliberately no idle auto-spin (unlike the
    // decorative home hero) — this view exists to be clicked precisely,
    // and a moving target under the cursor actively hurts that.
    if(!dragging){ dragVelY*=0.9; dragVelX*=0.9; group.rotation.y += dragVelY; group.rotation.x += dragVelX; }
    renderer.render(scene, camera);
    renderLabels();
    raf = requestAnimationFrame(tick);
  }
  if(reduceMotion){ renderer.render(scene, camera); renderLabels(); } else { tick(); }

  activeView3D = {
    dispose(){
      if(raf) cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      window.removeEventListener('pointerup', onPointerUp);
      canvas.removeEventListener('pointerdown', onPointerDown);
      canvas.removeEventListener('pointermove', onPointerMove);
      nodes.forEach(m=>{ m.geometry.dispose(); m.material.dispose(); });
      pathGeom.dispose(); pathMat.dispose();
      renderer.dispose();
    }
  };
}

/* ============ RENDER: CAMPUS TOUR ============
   A stylized, procedurally-built library room — not a photorealistic
   asset (this session can't source/produce 3D models), but a genuinely
   walkable space: click to lock the pointer for mouse-look, WASD/arrows to
   move, Escape to release. */
function renderCampus(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="view-wrap">
      <button class="back-link" id="campusBackBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> All courses</button>
      <h1>Virtual Campus — Library</h1>
      <p class="lede">A quick look inside. Click the scene to look around, then use WASD or the arrow keys to walk.</p>
      <div class="stage-3d tall" id="campusStage">
        <canvas id="campusCanvas"></canvas>
        <div class="stage-hint" id="campusHint">🖱️ Click to look around · WASD / arrows to walk · Esc to release</div>
      </div>
    </div>
  `;
  document.getElementById('campusBackBtn').addEventListener('click', ()=>{ location.hash = '#/'; });
  initCampusScene();
}

function initCampusScene(){
  const canvas = document.getElementById('campusCanvas');
  const hint = document.getElementById('campusHint');
  if(!canvas || typeof THREE === 'undefined') return;
  let renderer;
  try{ renderer = new THREE.WebGLRenderer({canvas, antialias:true}); }
  catch(e){ return; }
  renderer.shadowMap.enabled = false;

  const ROOM_W = 22, ROOM_D = 16, ROOM_H = 5.5;
  const scene = new THREE.Scene();
  const bgColor = 0x1a1f30;
  scene.background = new THREE.Color(bgColor);
  scene.fog = new THREE.Fog(bgColor, 8, 26);

  const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 100);
  camera.position.set(0, 1.65, ROOM_D/2 - 2);
  // Three.js's default camera forward is -Z, so yaw=0 already faces into
  // the room from this spawn point near the +Z wall — confirmed live that
  // yaw=Math.PI (the first attempt) instead faced the camera at the wall
  // two units behind its own spawn point, filling the view with a
  // close-up of the wall texture.
  let yaw = 0, pitch = 0;

  scene.add(new THREE.AmbientLight(0xfff2df, 0.55));
  const lampPositions = [[-6,-4],[6,-4],[-6,4],[6,4],[0,0]];
  const lamps = lampPositions.map(([x,z])=>{
    const l = new THREE.PointLight(0xffd9a0, 1.1, 12, 2);
    l.position.set(x, ROOM_H-0.6, z);
    scene.add(l);
    return l;
  });

  const floorMat = new THREE.MeshStandardMaterial({color:0x5b4632, roughness:0.85});
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), floorMat);
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);

  const ceilMat = new THREE.MeshStandardMaterial({color:0x22283a, roughness:1});
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), ceilMat);
  ceiling.rotation.x = Math.PI/2;
  ceiling.position.y = ROOM_H;
  scene.add(ceiling);

  const wallMat = new THREE.MeshStandardMaterial({color:0x3a2f22, roughness:0.9});
  const walls = [
    {w:ROOM_W, h:ROOM_H, pos:[0,ROOM_H/2,-ROOM_D/2], rot:[0,0,0]},
    {w:ROOM_W, h:ROOM_H, pos:[0,ROOM_H/2, ROOM_D/2], rot:[0,Math.PI,0]},
    {w:ROOM_D, h:ROOM_H, pos:[-ROOM_W/2,ROOM_H/2,0], rot:[0,Math.PI/2,0]},
    {w:ROOM_D, h:ROOM_H, pos:[ ROOM_W/2,ROOM_H/2,0], rot:[0,-Math.PI/2,0]},
  ];
  walls.forEach(w=>{
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w.w,w.h), wallMat);
    mesh.position.set(...w.pos);
    mesh.rotation.set(...w.rot);
    scene.add(mesh);
  });

  // Bookshelves: rows of shelf frames, each stacked with small "book" boxes
  // colored from the same course hues used everywhere else on the site.
  const shelfGroup = new THREE.Group();
  const frameMat = new THREE.MeshStandardMaterial({color:0x2c2013, roughness:0.7});
  function buildShelf(x, z, rotY){
    const g = new THREE.Group();
    const frame = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.6, 0.5), frameMat);
    frame.position.y = 1.3;
    g.add(frame);
    for(let row=0; row<3; row++){
      for(let i=0; i<10; i++){
        const hue = HERO_HUES[(row*10+i) % HERO_HUES.length];
        const book = new THREE.Mesh(
          new THREE.BoxGeometry(0.24, 0.55 + (i%3)*0.08, 0.34),
          new THREE.MeshStandardMaterial({color: hslToHexNum(hue,55,45), roughness:0.6})
        );
        // Frame is 0.5 deep (±0.25 locally) — push books out past its
        // front face (0.25) plus their own half-depth (0.17) so they sit
        // visibly in front of it instead of z-fighting/hiding inside its
        // solid volume, confirmed live as a wall of flat brown boxes with
        // no visible book stripes before this fix.
        book.position.set(-1.35 + i*0.3, 0.55 + row*0.78, 0.42);
        g.add(book);
      }
    }
    g.position.set(x, 0, z);
    g.rotation.y = rotY;
    return g;
  }
  // Shelves line the left/right walls (x=-8/x=+8); their books face along
  // the shelf's local +Z, so they need a 90° turn to face the center
  // aisle (+X from the left wall, -X from the right) rather than along
  // the wall itself — confirmed live as the first version facing shelves
  // toward each other lengthwise instead of out into the room.
  const shelfRows = [
    [-8,-5,Math.PI/2], [-8,0,Math.PI/2], [-8,5,Math.PI/2],
    [8,-5,-Math.PI/2], [8,0,-Math.PI/2], [8,5,-Math.PI/2],
  ];
  shelfRows.forEach(([x,z,r])=>shelfGroup.add(buildShelf(x,z,r)));
  scene.add(shelfGroup);

  // A reading table in the middle of the room.
  const tableMat = new THREE.MeshStandardMaterial({color:0x4a3521, roughness:0.6});
  const table = new THREE.Mesh(new THREE.BoxGeometry(3, 0.12, 1.4), tableMat);
  table.position.set(0, 0.9, 1);
  scene.add(table);
  [[-1.3,-0.6],[1.3,-0.6],[-1.3,0.6],[1.3,0.6]].forEach(([x,z])=>{
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.9,0.12), tableMat);
    leg.position.set(x, 0.45, 1+z);
    scene.add(leg);
  });

  // --- Look (pointer lock) + move (WASD) controls ---
  const keys = Object.create(null);
  function onKeyDown(e){ keys[e.code]=true; if(e.code==='Escape') document.exitPointerLock && document.exitPointerLock(); }
  function onKeyUp(e){ keys[e.code]=false; }
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);

  function onClickCanvas(){
    if(!canvas.requestPointerLock) return;
    // requestPointerLock() returns a promise (in browsers new enough to
    // return one at all) that rejects when the browser/embedding context
    // blocks it — confirmed live as an unhandled-rejection console
    // exception without this catch. WASD movement doesn't depend on
    // pointer lock at all, and the touch-drag fallback below still
    // provides look control, so a rejection here just means the user
    // keeps whatever look control they already had.
    const result = canvas.requestPointerLock();
    if(result && result.catch) result.catch(()=>{});
  }
  canvas.addEventListener('click', onClickCanvas);

  function onPointerLockChange(){
    const locked = document.pointerLockElement === canvas;
    hint.textContent = locked
      ? '🖱️ Mouse-look active · WASD / arrows to walk · Esc to release'
      : '🖱️ Click to look around · WASD / arrows to walk · Esc to release';
  }
  document.addEventListener('pointerlockchange', onPointerLockChange);

  function onMouseMoveLocked(e){
    if(document.pointerLockElement !== canvas) return;
    yaw -= e.movementX * 0.0025;
    pitch -= e.movementY * 0.0025;
    pitch = Math.max(-1.1, Math.min(1.1, pitch));
  }
  document.addEventListener('mousemove', onMouseMoveLocked);

  // Touch/mobile fallback: drag to look, since pointer lock isn't
  // reliably available on touch devices.
  let touching=false, lastTX=0, lastTY=0;
  function onTouchStart(e){ touching=true; const t=e.touches[0]; lastTX=t.clientX; lastTY=t.clientY; }
  function onTouchMove(e){
    if(!touching) return;
    const t=e.touches[0];
    yaw -= (t.clientX-lastTX)*0.004;
    pitch -= (t.clientY-lastTY)*0.004;
    pitch = Math.max(-1.1, Math.min(1.1, pitch));
    lastTX=t.clientX; lastTY=t.clientY;
    e.preventDefault();
  }
  function onTouchEnd(){ touching=false; }
  canvas.addEventListener('touchstart', onTouchStart, {passive:true});
  canvas.addEventListener('touchmove', onTouchMove, {passive:false});
  canvas.addEventListener('touchend', onTouchEnd);

  function resize(){
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(rect.width,1), h = Math.max(rect.height,1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.setSize(w,h,false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  const BOUND = 0.9; // stay just inside the walls
  const clock = new THREE.Clock();
  let raf = null;
  function tick(){
    const dt = Math.min(clock.getDelta(), 0.05);
    const speed = 4.2;
    const forward = (keys['KeyW']||keys['ArrowUp']?1:0) - (keys['KeyS']||keys['ArrowDown']?1:0);
    const strafe = (keys['KeyD']||keys['ArrowRight']?1:0) - (keys['KeyA']||keys['ArrowLeft']?1:0);
    if(forward || strafe){
      // World-space forward for yaw-only rotation is (-sin(yaw), 0,
      // -cos(yaw)) (Three's camera forward is -Z), right is (cos(yaw), 0,
      // -sin(yaw)) — confirmed live that the first version had the forward
      // term's sign flipped on both axes, so W walked the camera backward
      // through the wall behind it instead of into the room.
      const dx = -Math.sin(yaw)*forward + Math.cos(yaw)*strafe;
      const dz = -Math.cos(yaw)*forward - Math.sin(yaw)*strafe;
      camera.position.x += dx*speed*dt;
      camera.position.z += dz*speed*dt;
      camera.position.x = Math.max(-ROOM_W/2+BOUND, Math.min(ROOM_W/2-BOUND, camera.position.x));
      camera.position.z = Math.max(-ROOM_D/2+BOUND, Math.min(ROOM_D/2-BOUND, camera.position.z));
    }
    camera.rotation.set(0,0,0);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
    lamps.forEach((l,i)=>{ l.intensity = 1.1 + Math.sin(clock.getElapsedTime()*1.4 + i)*0.06; });
    renderer.render(scene, camera);
    raf = requestAnimationFrame(tick);
  }
  tick();

  activeView3D = {
    dispose(){
      if(raf) cancelAnimationFrame(raf);
      if(document.pointerLockElement === canvas && document.exitPointerLock) document.exitPointerLock();
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
      window.removeEventListener('resize', resize);
      document.removeEventListener('pointerlockchange', onPointerLockChange);
      document.removeEventListener('mousemove', onMouseMoveLocked);
      canvas.removeEventListener('click', onClickCanvas);
      canvas.removeEventListener('touchstart', onTouchStart);
      canvas.removeEventListener('touchmove', onTouchMove);
      canvas.removeEventListener('touchend', onTouchEnd);
      scene.traverse(obj=>{
        if(obj.geometry) obj.geometry.dispose();
        if(obj.material) obj.material.dispose();
      });
      renderer.dispose();
    }
  };
}

/* ============ RENDER: PROGRESS (3D DATA VIZ) ============
   Two spatial views of the same numbers already shown flatly on Home:
   a 10x10 cube grid (one cube per topic, all 100 of them, lit up by
   course color once done) and a row of per-course bars that grow in on
   load. Numeric stat tiles sit alongside for anyone who wants exact
   figures rather than reading them off a 3D shape. */
function renderProgress(){
  const main = document.getElementById('main');
  const done = totalDoneCount();
  main.innerHTML = `
    <div class="view-wrap">
      <button class="back-link" id="progressBackBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> All courses</button>
      <h1>Your Progress</h1>
      <p class="lede">Every topic across every course, in one view. Each lit cube is one you've completed.</p>
      <div class="stage-3d" id="progressStage">
        <canvas id="progressCanvas"></canvas>
        <div class="stage-labels" id="progressLabels"></div>
        <div class="stage-hint">🖱️ Drag to orbit</div>
      </div>
      <div class="hero-stats" style="margin-top:22px;">
        <div class="stat-tile"><div class="n">${done}/${TOTAL_TOPICS}</div><div class="l">Topics completed</div></div>
        <div class="stat-tile"><div class="n">${((done/TOTAL_TOPICS)*100).toFixed(0)}%</div><div class="l">Overall progress</div></div>
        <div class="stat-tile"><div class="n">${COURSES.filter(c=>courseDoneCount(c)>0).length}</div><div class="l">Courses started</div></div>
        <div class="stat-tile"><div class="n">${COURSES.filter(c=>courseDoneCount(c)===c.topics.length).length}</div><div class="l">Courses completed</div></div>
      </div>
    </div>
  `;
  document.getElementById('progressBackBtn').addEventListener('click', ()=>{ location.hash = '#/'; });
  initProgressScene();
}

function initProgressScene(){
  const canvas = document.getElementById('progressCanvas');
  const labelLayer = document.getElementById('progressLabels');
  if(!canvas || typeof THREE === 'undefined') return;
  let renderer;
  try{ renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true}); }
  catch(e){ return; }

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
  camera.position.set(0, 4, 14);
  camera.lookAt(0,0.5,0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dir = new THREE.DirectionalLight(0xffffff, 0.7);
  dir.position.set(4,7,6);
  scene.add(dir);

  const group = new THREE.Group();
  scene.add(group);

  // Flattened, ordered list of every topic across every course.
  const allTopics = [];
  COURSES.forEach(c=>c.topics.forEach((t,i)=>allTopics.push({course:c, i})));

  const GRID = 10; // 10x10 = 100 = TOTAL_TOPICS
  const cubeGroup = new THREE.Group();
  cubeGroup.position.set(0, 3.2, -1);
  const cubeSize = 0.42, gap = 0.14;
  const span = GRID*(cubeSize+gap);
  const cubeMeshes = allTopics.map((entry, idx)=>{
    const row = Math.floor(idx/GRID), col = idx%GRID;
    const done = isDone(entry.course.id, entry.i);
    const color = hslToHexNum(entry.course.hue, 65, 55);
    const mat = new THREE.MeshStandardMaterial({
      color: done ? color : 0x2a3148,
      roughness:0.4, metalness:0.15,
      transparent:true, opacity: done?1:0.35,
      emissive: done?color:0x000000, emissiveIntensity: done?0.35:0,
    });
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(cubeSize,cubeSize,cubeSize), mat);
    mesh.position.set(col*(cubeSize+gap) - span/2, -row*(cubeSize+gap) + span/2, 0);
    mesh.userData = {phase: Math.random()*Math.PI*2};
    cubeGroup.add(mesh);
    return mesh;
  });
  group.add(cubeGroup);

  // Per-course bars underneath the cube grid.
  const barGroup = new THREE.Group();
  barGroup.position.set(0, 0, 0);
  const barW = 0.7, barGap = 0.28, maxH = 3, barGeomH = 0.02;
  const barSpan = COURSES.length*(barW+barGap);
  const bars = COURSES.map((c,i)=>{
    const pct = courseDoneCount(c)/c.topics.length;
    const color = hslToHexNum(c.hue, 65, 55);
    const mat = new THREE.MeshStandardMaterial({color, roughness:0.35, metalness:0.15, emissive:color, emissiveIntensity:0.18});
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(barW, barGeomH, barW*0.6), mat);
    const x = i*(barW+barGap) - barSpan/2 + barW/2;
    mesh.position.set(x, 0.01, 0);
    mesh.userData = {targetH: Math.max(0.02, pct*maxH), x, course:c};
    barGroup.add(mesh);
    return mesh;
  });
  group.add(barGroup);

  const floorMat = new THREE.MeshStandardMaterial({color:0x1c2338, roughness:0.9, transparent:true, opacity:0.6});
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(barSpan+2, 3), floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.y = 0;
  group.add(floor);

  let mouseX=0;
  function onMouseMove(e){ mouseX=(e.clientX/window.innerWidth)-0.5; }
  window.addEventListener('mousemove', onMouseMove);

  let dragging=false, lastX=0, lastY=0, dragVelX=0, dragVelY=0;
  canvas.classList.add('grabbable');
  function onPointerDown(e){ dragging=true; lastX=e.clientX; lastY=e.clientY; dragVelX=0; dragVelY=0; canvas.classList.add('dragging'); try{canvas.setPointerCapture(e.pointerId);}catch(err){} }
  function onPointerMove(e){
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY;
    dragVelY = dx*0.006; dragVelX = dy*0.006;
    group.rotation.y += dragVelY;
    group.rotation.x = Math.max(-0.35, Math.min(0.35, group.rotation.x + dragVelX));
  }
  function onPointerUp(){ dragging=false; canvas.classList.remove('dragging'); }
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);

  function resize(){
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(rect.width,1), h = Math.max(rect.height,1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.setSize(w,h,false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  function renderLabels(){
    labelLayer.innerHTML = bars.map(mesh=>{
      const worldPos = new THREE.Vector3(mesh.userData.x, mesh.userData.targetH + 0.35, 0).applyMatrix4(group.matrixWorld);
      const p = project3D(worldPos, camera, canvas);
      if(p.behind) return '';
      return `<div class="map-label" style="left:${p.x}px; top:${p.y}px;">${escapeHtml(mesh.userData.course.code)}</div>`;
    }).join('');
  }

  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const clock = new THREE.Clock();
  let raf = null;
  function tick(){
    const t = clock.getElapsedTime();
    // Grow-in animation for the bars: geometry height is a fixed 0.02
    // (barGeomH below) with scale.y stretching it up to the eased target —
    // deterministic per frame from elapsed time, so no per-frame state to
    // track or drift.
    bars.forEach(mesh=>{
      const h = Math.max(0.02, mesh.userData.targetH * dt3(t));
      mesh.scale.y = h/barGeomH;
      mesh.position.y = h/2;
    });
    cubeMeshes.forEach(m=>{ m.rotation.y = Math.sin(t*0.3+m.userData.phase)*0.15; });
    if(!dragging){ group.rotation.y += 0.0012; }
    camera.position.x += (mouseX*0.8 - camera.position.x*0.05)*0.02;
    renderer.render(scene, camera);
    renderLabels();
    raf = requestAnimationFrame(tick);
  }
  function dt3(t){ return Math.min(1, t/1.2); } // 1.2s ease-in window for the grow animation
  if(reduceMotion){
    bars.forEach(mesh=>{ const h=mesh.geometry.parameters.height; mesh.scale.y = Math.max(0.02,mesh.userData.targetH)/h; mesh.position.y = mesh.userData.targetH/2; });
    renderer.render(scene, camera); renderLabels();
  } else { tick(); }

  activeView3D = {
    dispose(){
      if(raf) cancelAnimationFrame(raf);
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('resize', resize);
      window.removeEventListener('pointerup', onPointerUp);
      canvas.removeEventListener('pointerdown', onPointerDown);
      canvas.removeEventListener('pointermove', onPointerMove);
      cubeMeshes.forEach(m=>{ m.geometry.dispose(); m.material.dispose(); });
      bars.forEach(m=>{ m.geometry.dispose(); m.material.dispose(); });
      floorMat.dispose(); floor.geometry.dispose();
      renderer.dispose();
    }
  };
}

/* ============ MAIN RENDER ============ */
function updateTopNav(route){
  document.querySelectorAll('.topnav-link').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.route === '#/'+route.view);
  });
}
function render(){
  const route = parseHash();
  updateThemeIcon();
  disposeHeroScene();
  disposeActiveView3D();
  if(route.view==='course'){
    renderCourse(route.course, route.ti);
  } else if(route.view==='map'){
    renderMap();
  } else if(route.view==='campus'){
    renderCampus();
  } else if(route.view==='progress'){
    renderProgress();
  } else {
    renderHome();
    initHeroScene();
  }
  updateTopNav(route);
  updateOverallStat();
  window.scrollTo(0,0);
}

initTheme();
render();
</script>
